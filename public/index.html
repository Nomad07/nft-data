<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFT Data - OpenSea collection intelligence for AI agents</title>
  <meta name="description" content="Query any OpenSea NFT collection and get structured market data instantly. An ERC-8257 AI agent tool." />
  <link rel="canonical" href="https://www.nftdata.app/" />
  <meta property="og:title" content="NFT Data - OpenSea collection intelligence for AI agents" />
  <meta property="og:description" content="Query any OpenSea NFT collection and get structured market data instantly. An ERC-8257 AI agent tool." />
  <meta property="og:image" content="https://www.nftdata.app/nft-data-banner.svg" />
  <meta property="og:url" content="https://www.nftdata.app/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="NFT Data - OpenSea collection intelligence for AI agents" />
  <meta name="twitter:description" content="Query any OpenSea NFT collection and get structured market data instantly. An ERC-8257 AI agent tool." />
  <meta name="twitter:image" content="https://www.nftdata.app/nft-data-banner.svg" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --bg: #0d1b2f;
      --bg-gradient: linear-gradient(180deg, #0d1b2f 0%, #0d1b2f 58%, #122d45 100%);
      --surface: rgba(255, 255, 255, 0.07);
      --surface-strong: rgba(255, 255, 255, 0.11);
      --surface-muted: #1f2f44;
      --ink: #f9faf3;
      --ink-2: #e3ecf9;
      --muted: #cbd5e1;
      --subtle: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
      --border-strong: rgba(203, 219, 242, 0.55);
      --accent: #acc6e9;
      --accent-hover: #cbdbf2;
      --success: #8dd89f;
      --danger: #e86d7a;
      --radius: 12px;
      --radius-sm: 8px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }

    .display { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.03em; }
    .mono { font-family: 'JetBrains Mono', Menlo, monospace; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* ── Layout ── */
    .page {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* ── Header ── */
    .header { display: flex; flex-direction: column; gap: 6px; }

    .header-wordmark {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wordmark-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--surface-strong);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .wordmark-icon svg { display: block; }
    a.wordmark-icon { color: inherit; text-decoration: none; }
    a.wordmark-icon:hover { text-decoration: none; opacity: 0.8; }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
    }

    .header p {
      font-size: 14px;
      color: var(--subtle);
      line-height: 1.5;
      text-pretty: auto;
    }

    /* ── Search card ── */
    .search-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--subtle);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .slug-input {
      flex: 1;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-family: 'JetBrains Mono', Menlo, monospace;
      font-size: 14px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s;
      min-width: 0;
    }

    .slug-input::placeholder { color: var(--subtle); }

    .try-example {
      font-size: 12px;
      color: var(--subtle);
      margin-top: 8px;
    }

    .try-example a { color: var(--accent); }

    .slug-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(172, 198, 233, 0.15);
    }

    .btn-primary {
      background: var(--accent);
      color: #0d1b2f;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 20px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
      min-height: 44px;
      flex-shrink: 0;
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ── Status strip ── */
    .status-strip {
      font-size: 13px;
      color: var(--subtle);
      min-height: 20px;
      padding-top: 2px;
    }

    .status-strip.error { color: var(--danger); }
    .status-strip.loading { color: var(--muted); }

    /* ── Results ── */
    .results { display: flex; flex-direction: column; gap: 16px; }

    .collection-header {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .collection-header-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .copy-link-btn {
      flex-shrink: 0;
      align-self: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--subtle);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px 12px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .copy-link-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--surface-strong);
    }

    .copy-link-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .copy-link-btn.copied {
      color: var(--success);
      border-color: var(--success);
    }

    .collection-name {
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .collection-slug {
      font-size: 13px;
      color: var(--subtle);
      font-family: 'JetBrains Mono', Menlo, monospace;
    }

    /* ── Stat grid ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 540px) {
      .stat-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--subtle);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .stat-value.display { font-family: 'Space Grotesk', sans-serif; }

    .stat-currency {
      font-size: 13px;
      font-weight: 500;
      color: var(--subtle);
      margin-left: 5px;
    }

    /* ── Contract card ── */
    .contract-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .contract-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--subtle);
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .contract-address-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .contract-address {
      font-family: 'JetBrains Mono', Menlo, monospace;
      font-size: 13px;
      color: var(--ink-2);
      word-break: break-all;
      line-height: 1.5;
      flex: 1;
    }

    .addr-copy-btn {
      flex-shrink: 0;
      margin-top: 2px;
      background: none;
      border: none;
      padding: 2px 4px;
      cursor: pointer;
      color: var(--subtle);
      border-radius: 4px;
      line-height: 1;
      font-size: 13px;
      transition: color 0.15s;
    }

    .addr-copy-btn:hover { color: var(--accent); }
    .addr-copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .addr-copy-btn.copied { color: var(--success); }

    .contract-chain {
      font-size: 12px;
      color: var(--subtle);
      font-weight: 500;
    }

    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 48px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-state h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--muted);
    }

    .empty-state p {
      font-size: 14px;
      color: var(--subtle);
      max-width: 320px;
      text-pretty: auto;
    }

    /* ── Error state ── */
    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 40px 20px;
      text-align: center;
      background: var(--surface);
      border: 1px solid rgba(232, 109, 122, 0.3);
      border-radius: var(--radius);
    }

    .error-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(232, 109, 122, 0.12);
      border: 1px solid rgba(232, 109, 122, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .error-state h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--danger);
    }

    .error-state p {
      font-size: 14px;
      color: var(--muted);
      max-width: 360px;
      text-pretty: auto;
      line-height: 1.5;
    }

    .btn-ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      min-height: 36px;
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--accent-hover); }
    .btn-ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Footer ── */
    footer {
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .footer-top-row {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .footer-left {
      font-size: 11px;
      color: var(--subtle);
      text-align: left;
      white-space: nowrap;
    }

    .footer-left .heart { color: #e86d7a; }

    .footer-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--subtle);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      text-align: center;
    }

    .footer-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .footer-right a {
      font-size: 12px;
      color: var(--subtle);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-right a:hover { color: var(--accent); text-decoration: none; }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      justify-content: center;
    }

    .footer-links a {
      font-size: 12px;
      color: var(--subtle);
      transition: color 0.15s;
    }

    .footer-links a:hover {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .footer-top-row {
        grid-template-columns: 1fr;
        justify-items: center;
      }
      .footer-left { text-align: center; }
      .footer-right { justify-content: center; }
    }

    /* ── Loading spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(13, 27, 47, 0.25);
      border-top-color: #0d1b2f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    /* ── Divider ── */
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--subtle);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .section-title-updated {
      font-size: 11px;
      font-weight: 500;
      color: var(--subtle);
      letter-spacing: 0.03em;
      text-transform: none;
      font-family: 'DM Sans', sans-serif;
    }
  </style>
</head>
<body>

<main class="page">

  <!-- Header -->
  <header class="header">
    <div class="header-wordmark">
      <a class="wordmark-icon" href="https://nftdata.app/" aria-label="Home" title="Home">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="6" height="6" rx="1.5" fill="#acc6e9"/>
          <rect x="10" y="2" width="6" height="6" rx="1.5" fill="#acc6e9" opacity="0.5"/>
          <rect x="2" y="10" width="6" height="6" rx="1.5" fill="#acc6e9" opacity="0.5"/>
          <rect x="10" y="10" width="6" height="6" rx="1.5" fill="#acc6e9" opacity="0.3"/>
        </svg>
      </a>
      <h1 class="display">NFT Data</h1>
    </div>
    <p>OpenSea collection intelligence for AI agents</p>
  </header>

  <!-- Search -->
  <section aria-label="Collection lookup">
    <div class="search-card">
      <label class="field-label" for="slug-input">Collection slug</label>
      <div class="input-row">
        <input
          id="slug-input"
          class="slug-input"
          type="text"
          placeholder="azuki"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          aria-describedby="status-msg"
        />
        <button
          id="fetch-btn"
          class="btn-primary"
          type="button"
          aria-live="polite"
        >
          Get collection data
        </button>
      </div>
      <div id="status-msg" class="status-strip" aria-live="polite" aria-atomic="true"></div>
      <p class="try-example">Try: <a href="https://nftdata.app/?collection=pudgypenguins">Pudgy Penguins</a></p>
    </div>
  </section>

  <!-- Results / Empty state -->
  <section id="results-area" aria-label="Collection data" aria-live="polite">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="7" stroke="#94a3b8" stroke-width="1.5"/>
          <path d="M15.5 15.5L20 20" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>No collection loaded</h2>
      <p>Enter an OpenSea collection slug above to retrieve live market data.</p>
    </div>

    <div id="data-panel" hidden>
      <!-- populated by JS -->
    </div>
  </section>

</main>

<footer>
  <div class="footer-top-row">
    <span class="footer-left">Made with <span class="heart">&#10084;&#65039;</span> on Mars</span>
    <span class="footer-badge">AI Agent Tool &nbsp;·&nbsp; ERC-8257 &nbsp;·&nbsp; Base &nbsp;·&nbsp; NFT Data</span>
    <div class="footer-right">
      <a href="https://github.com/Nomad07/nft-data" target="_blank" rel="noopener noreferrer" aria-label="GitHub">GitHub</a>
      <a href="https://x.com/nomadonmars" target="_blank" rel="noopener noreferrer" aria-label="X / Twitter">X / Twitter</a>
    </div>
  </div>
  <nav class="footer-links" aria-label="Tool links">
    <a href="https://opensea.io/tools/erc8257/base/778" target="_blank" rel="noopener noreferrer">OpenSea Tool #778</a>
    <a href="/api/get-collection-data" target="_blank" rel="noopener noreferrer">API</a>
    <a href="/.well-known/ai-tool/nft-data.json" target="_blank" rel="noopener noreferrer">Manifest</a>
  </nav>
</footer>

<script>
(function () {
  'use strict';

  const input  = document.getElementById('slug-input');
  const btn    = document.getElementById('fetch-btn');
  const status = document.getElementById('status-msg');
  const empty  = document.getElementById('empty-state');
  const panel  = document.getElementById('data-panel');

  // ── State constants ──────────────────────────────────────────────────────
  // IDLE    : initial — empty state visible, panel hidden
  // LOADING : request in flight — both hidden, button spinner
  // SUCCESS : data rendered — panel visible, empty hidden
  // ERROR   : request failed — error card in panel, empty hidden
  // ────────────────────────────────────────────────────────────────────────

  function setStatus(msg, type) {
    status.textContent = msg;
    status.className = 'status-strip' + (type ? ' ' + type : '');
  }

  function setBusy(busy) {
    btn.disabled = busy;
    input.disabled = busy;
    btn.innerHTML = busy
      ? '<span class="spinner" aria-hidden="true"></span>Loading\u2026'
      : 'Get collection data';
  }

  function showEmpty() {
    empty.hidden = false;
    panel.hidden = true;
    panel.innerHTML = '';
  }

  function showPanel() {
    empty.hidden = true;
    panel.hidden = false;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function fmt(val) {
    if (val === null || val === undefined) return '\u2014';
    if (typeof val === 'number') {
      if (Number.isInteger(val)) return val.toLocaleString('en-US');
      return val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
    }
    return String(val);
  }

  function fmtDate(val) {
    if (!val) return '\u2014';
    var d = new Date(val);
    if (isNaN(d.getTime())) return String(val);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function renderStat(label, value, currency) {
    var currencySpan = currency
      ? '<span class="stat-currency">' + escHtml(String(currency)) + '</span>'
      : '';
    return [
      '<div class="stat-card">',
      '  <div class="stat-label">' + escHtml(label) + '</div>',
      '  <div class="stat-value display tabular">' + escHtml(fmt(value)) + currencySpan + '</div>',
      '</div>',
    ].join('');
  }

  function renderError(heading, msg) {
    panel.innerHTML = [
      '<div class="error-state">',
      '  <div class="error-icon">',
      '    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">',
      '      <circle cx="10" cy="10" r="8" stroke="#e86d7a" stroke-width="1.5"/>',
      '      <path d="M10 6v5" stroke="#e86d7a" stroke-width="1.5" stroke-linecap="round"/>',
      '      <circle cx="10" cy="14" r="0.75" fill="#e86d7a"/>',
      '    </svg>',
      '  </div>',
      '  <h2>' + escHtml(heading) + '</h2>',
      '  <p>' + escHtml(msg) + '</p>',
      '  <button class="btn-ghost" id="try-again-btn" type="button">Try another collection</button>',
      '</div>',
    ].join('');

    showPanel();

    var tryAgainBtn = document.getElementById('try-again-btn');
    if (tryAgainBtn) {
      tryAgainBtn.addEventListener('click', function () {
        panel.hidden = true;
        panel.innerHTML = '';
        setStatus('');
        input.disabled = false;
        input.focus();
        input.select();
      });
    }
  }

  function renderData(d) {
    var contracts = Array.isArray(d.contracts) && d.contracts.length > 0 ? d.contracts : [];

    var contractsHtml = contracts.map(function (c) {
      return [
        '<div class="contract-card">',
        '  <div class="contract-address-row">',
        '    <div class="contract-address mono">' + escHtml(c.address || '\u2014') + '</div>',
        c.address ? '    <button class="addr-copy-btn" type="button" aria-label="Copy address" data-addr="' + escHtml(c.address) + '">' +
          '<svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">' +
          '<rect x="4.5" y="4.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.2"/>' +
          '<path d="M3 8.5H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>' +
          '</svg>' +
          '</button>' : '',
        '  </div>',
        '  <div class="contract-chain">' + escHtml(c.chain || '\u2014') + '</div>',
        '</div>',
      ].join('');
    }).join('');

    panel.innerHTML = [
      '<div class="results">',

      '<div class="collection-header">',
      '  <div class="collection-header-text">',
      '    <div class="collection-name display">' + escHtml(d.name || '\u2014') + '</div>',
      '    <div class="collection-slug mono">' + escHtml(d.slug || '\u2014') + '</div>',
      '  </div>',
      '  <button class="copy-link-btn" id="copy-link-btn" type="button">Copy Link</button>',
      '</div>',

      '<div class="section-title">Market</div>',
      '<div class="stat-grid">',
      renderStat('Floor price',   d.floor_price,       d.floor_price_currency),
      renderStat('24h sales',     d.one_day_sales,     null),
      renderStat('24h volume',    d.one_day_volume,    d.one_day_volume_currency),
      renderStat('Total sales',   d.total_sales,       null),
      renderStat('Total volume',  d.total_volume,      d.total_volume_currency),
      renderStat('Owners',        d.num_owners,        null),
      renderStat('7d sales',      d.seven_day_sales,   null),
      renderStat('7d volume',     d.seven_day_volume,  d.seven_day_volume_currency),
      renderStat('30d sales',     d.thirty_day_sales,  null),
      renderStat('30d volume',    d.thirty_day_volume, d.thirty_day_volume_currency),
      renderStat('Total supply',  d.total_supply,      null),
      renderStat('Created',       fmtDate(d.created_date), null),
      '</div>',

      contracts.length > 0 ? '<div class="section-title"><span>Contract</span>' + (lastUpdated ? '<span class="section-title-updated">Updated ' + escHtml(lastUpdated) + '</span>' : '') + '</div>' : '',
      contractsHtml,

      '</div>',
    ].join('');

    showPanel();
  }

  var currentSlug = '';
  var lastUpdated = '';

  function getDeepLink(slug) {
    return 'https://nftdata.app/?collection=' + encodeURIComponent(slug);
  }

  function attachCopyLink() {
    var copyBtn = document.getElementById('copy-link-btn');
    if (!copyBtn) return;
    copyBtn.addEventListener('click', function () {
      if (!currentSlug) return;
      var url = getDeepLink(currentSlug);
      navigator.clipboard.writeText(url).then(function () {
        copyBtn.textContent = 'Link copied \u2713';
        copyBtn.classList.add('copied');
        setTimeout(function () {
          copyBtn.textContent = 'Copy Link';
          copyBtn.classList.remove('copied');
        }, 2000);
      }).catch(function () {
        // Fallback for browsers without clipboard API
        var ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        copyBtn.textContent = 'Link copied \u2713';
        copyBtn.classList.add('copied');
        setTimeout(function () {
          copyBtn.textContent = 'Copy Link';
          copyBtn.classList.remove('copied');
        }, 2000);
      });
    });
  }

  async function fetchCollection(slug, pushUrl) {
    if (!slug.trim()) {
      setStatus('Enter a collection slug.', 'error');
      input.focus();
      return;
    }

    // LOADING state: hide everything, show spinner
    setBusy(true);
    setStatus('', '');
    empty.hidden = true;
    panel.hidden = true;
    panel.innerHTML = '';

    try {
      var res = await fetch('/api/collect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ collection: slug.trim() }),
      });

      var json = await res.json().catch(function () { return null; });

      if (!res.ok) {
        // ERROR state: show error card in panel, empty stays hidden
        if (res.status === 404) {
          renderError(
            'Collection not found',
            'We could not find an OpenSea collection with this slug. Check the slug and try again.'
          );
        } else {
          renderError(
            'Unable to retrieve collection data',
            'We could not retrieve this collection data right now. Please try again.'
          );
        }
        return;
      }

      if (!json || typeof json !== 'object') {
        renderError(
          'Unable to retrieve collection data',
          'We could not retrieve this collection data right now. Please try again.'
        );
        return;
      }

      // SUCCESS state: show data, empty stays hidden
      setStatus('');
      currentSlug = slug.trim();
      var now = new Date();
      lastUpdated = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      history.pushState(null, '', '?collection=' + encodeURIComponent(currentSlug));
      renderData(json);
      attachCopyLink();

    } catch (err) {
      // ERROR state: network failure
      renderError(
        'Unable to retrieve collection data',
        'Network error. Check your connection and try again.'
      );
    } finally {
      setBusy(false);
    }
  }

  // Delegated handler for contract address copy buttons
  panel.addEventListener('click', function (e) {
    var copyBtn = e.target.closest('.addr-copy-btn');
    if (!copyBtn) return;
    var addr = copyBtn.getAttribute('data-addr');
    if (!addr) return;
    var svgHtml = copyBtn.innerHTML;
    function confirm() {
      copyBtn.textContent = 'Copied \u2713';
      copyBtn.classList.add('copied');
      setTimeout(function () {
        copyBtn.innerHTML = svgHtml;
        copyBtn.classList.remove('copied');
      }, 2000);
    }
    navigator.clipboard.writeText(addr).then(confirm).catch(function () {
      var ta = document.createElement('textarea');
      ta.value = addr; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); confirm();
    });
  });

  btn.addEventListener('click', function () {
    fetchCollection(input.value);
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') fetchCollection(input.value);
  });

  // Deep-link support: auto-load collection from ?collection= query param
  var params = new URLSearchParams(window.location.search);
  var deepSlug = params.get('collection');
  if (deepSlug && deepSlug.trim()) {
    input.value = deepSlug.trim();
    fetchCollection(deepSlug.trim());
  } else {
    input.focus();
  }
})();
</script>
