  <text x="72" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#acc6e9" opacity="0.7">24h volume</text>
  <text x="220" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#acc6e9" opacity="0.7">Total sales</text>
  <text x="220" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#acc6e9" opacity="0.7">Owners</text>
  <text x="368" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#acc6e9" opacity="0.7">Base · Tool #778</text>
