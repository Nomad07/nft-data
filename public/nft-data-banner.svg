<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1b2f"/>
      <stop offset="100%" stop-color="#122d45"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#acc6e9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#acc6e9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="133" x2="1200" y2="133" stroke="#acc6e9" stroke-width="0.5" opacity="0.07"/>
  <line x1="0" y1="267" x2="1200" y2="267" stroke="#acc6e9" stroke-width="0.5" opacity="0.07"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="#acc6e9" stroke-width="0.5" opacity="0.07"/>
  <line x1="600" y1="0" x2="600" y2="400" stroke="#acc6e9" stroke-width="0.5" opacity="0.07"/>
  <line x1="900" y1="0" x2="900" y2="400" stroke="#acc6e9" stroke-width="0.5" opacity="0.07"/>

  <!-- Decorative tile cluster — right side -->
  <!-- Row 1 -->
  <rect x="810" y="72" width="68" height="68" rx="10" fill="#acc6e9" opacity="0.12" stroke="#acc6e9" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="892" y="72" width="68" height="68" rx="10" fill="#acc6e9" opacity="0.07" stroke="#acc6e9" stroke-width="1" stroke-opacity="0.15"/>
  <rect x="974" y="72" width="68" height="68" rx="10" fill="#acc6e9" opacity="0.04" stroke="#acc6e9" stroke-width="1" stroke-opacity="0.1"/>
  <rect x="1056" y="72" width="68" height="68" rx="10" fill="#acc6e9" opacity="0.02" stroke="#acc6e9" stroke-width="0.5" stroke-opacity="0.07"/>
  <!-- Row 2 -->
  <rect x="810" y="154" width="68" height="68" rx="10" fill="#acc6e9" opacity="0.07" stroke="#acc6e9" stroke-width="1" stroke-opacity="0.15"/>
  <rect x="892" y="154" width="68" height="68" rx="10" fill="#acc6e9" opacity="0.04" stroke="#acc6e9" stroke-width="1" stroke-opacity="0.1"/>
  <rect x="974" y="154" width="68" height="68" rx="10" fill="#acc6e9" opacity="0.02" stroke="#acc6e9" stroke-width="0.5" stroke-opacity="0.07"/>
  <rect x="1056" y="154" width="68" height="68" rx="10" fill="none" stroke="#acc6e9" stroke-width="0.5" stroke-opacity="0.05"/>
  <!-- Row 3 -->
  <rect x="810" y="236" width="68" height="68" rx="10" fill="#acc6e9" opacity="0.04" stroke="#acc6e9" stroke-width="0.5" stroke-opacity="0.1"/>
  <rect x="892" y="236" width="68" height="68" rx="10" fill="#acc6e9" opacity="0.02" stroke="#acc6e9" stroke-width="0.5" stroke-opacity="0.07"/>
  <rect x="974" y="236" width="68" height="68" rx="10" fill="none" stroke="#acc6e9" stroke-width="0.5" stroke-opacity="0.05"/>
  <rect x="1056" y="236" width="68" height="68" rx="10" fill="none" stroke="#acc6e9" stroke-width="0.5" stroke-opacity="0.03"/>

  <!-- Icon (top-left tile accent) -->
  <rect x="810" y="72" width="68" height="68" rx="10" fill="#acc6e9" opacity="0.2" stroke="#acc6e9" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="844" y1="87" x2="844" y2="123" stroke="#e3ecf9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="826" y1="105" x2="862" y2="105" stroke="#e3ecf9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="831" y1="92" x2="857" y2="118" stroke="#e3ecf9" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="857" y1="92" x2="831" y2="118" stroke="#e3ecf9" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Left content block -->
  <!-- Tag line -->
  <rect x="72" y="120" width="148" height="22" rx="4" fill="#acc6e9" opacity="0.12" stroke="#acc6e9" stroke-width="1" stroke-opacity="0.25"/>
  <text x="146" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#acc6e9" opacity="0.9" text-anchor="middle" letter-spacing="1.5">ERC-8257 AGENT TOOL</text>

  <!-- NFT Data wordmark -->
